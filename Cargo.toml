[workspace]
members = [
    "apps/windows",
    "crates/minimal-auth",
    "crates/minimal-blocker",
    "crates/minimal-core",
    "crates/minimal-storage",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
