name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build the app
        run: npm run build

      - name: Check renderer budgets
        run: npm run check:bundle

      - name: Build the landing page
        run: npm run vercel-build

      - name: Check landing-page metadata
        run: |
          test -s public/og.png
          test -s public/robots.txt
          test -s public/sitemap.xml
          ! grep -q '__SITE_URL__\|__VERSION__' public/index.html
