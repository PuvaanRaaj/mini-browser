name: Build macOS release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag to build (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 22

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS arm64 installer
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG and ZIP
        run: npm run dist:mac -- --arm64 --publish never

      - name: Verify release files
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          test -s "release/Minimal-${VERSION}-mac-arm64.dmg"
          test -s "release/Minimal-${VERSION}-mac-arm64.zip"
          test -s "release/latest-mac.yml"

      - name: Upload assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          files=(
            "release/Minimal-${VERSION}-mac-arm64.dmg"
            "release/Minimal-${VERSION}-mac-arm64.zip"
            "release/latest-mac.yml"
          )
          for blockmap in release/*.blockmap; do
            [[ -f "${blockmap}" ]] && files+=("${blockmap}")
          done

          gh release upload "${TAG}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
